services:
  go-service:
    build:
      context: .
      dockerfile: go-service/Dockerfile
    container_name: grpc-go-service
    environment:
      GRPC_PORT: "50051"
    ports:
      - "50051:50051"

  node-service:
    build:
      context: .
      dockerfile: node-service/Dockerfile
    container_name: grpc-node-service
    environment:
      GRPC_TARGET: "go-service:50051"
      HTTP_PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - go-service
